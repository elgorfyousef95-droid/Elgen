
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100904">
<title>Dr. Mahmoud El-Genainy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#100904}
body{font-family:Cairo,sans-serif;color:#fff}
.splash{position:fixed;inset:0;isolation:isolate;overflow:hidden;display:grid;place-items:center;background:#100904}
.bg-blur{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(25px) brightness(.32) saturate(.9);z-index:-5;transform:scale(1.08)}
.bg-main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;z-index:-4}
.shade{position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(10,6,2,.15),rgba(12,7,2,.2) 38%,rgba(10,6,2,.82)),radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.48) 100%)}
.glow{position:absolute;width:min(85vw,650px);height:min(85vw,650px);border-radius:50%;background:radial-gradient(circle,rgba(255,164,55,.13),rgba(255,164,55,.035) 42%,transparent 70%);z-index:-2;animation:pulse 4s ease-in-out infinite}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd18a;box-shadow:0 0 10px 3px rgba(255,170,72,.4);animation:float 7s ease-in-out infinite}
.particle:nth-child(1){top:18%;left:17%;animation-delay:-1s}
.particle:nth-child(2){top:32%;right:13%;animation-delay:-3s}
.particle:nth-child(3){top:67%;left:11%;animation-delay:-4s}
.particle:nth-child(4){top:76%;right:18%;animation-delay:-2s}
.particle:nth-child(5){top:12%;right:35%;animation-delay:-5s}
.particle:nth-child(6){top:53%;left:82%;animation-delay:-2.5s}
.content{width:min(92%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px;animation:appear 1.2s ease both}
.emblem{position:relative;width:clamp(112px,19vw,160px);height:clamp(112px,19vw,160px);display:grid;place-items:center;margin-bottom:25px}
.orbit{position:absolute;inset:0;border:1px solid rgba(255,190,104,.58);border-radius:50%;box-shadow:0 0 24px rgba(255,166,65,.13),inset 0 0 22px rgba(255,166,65,.08);animation:orbit 9s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd28b;box-shadow:0 0 14px 4px rgba(255,174,72,.65)}
.orbit:before{top:13%;left:18%}
.orbit:after{bottom:12%;right:16%;width:6px;height:6px}
.orbit.inner{inset:12%;border-style:dashed;border-color:rgba(255,205,140,.3);animation:orbitReverse 13s linear infinite}
.flask{width:65%;height:65%;filter:drop-shadow(0 0 13px rgba(255,174,72,.55))}
.flask path,.flask circle{fill:none;stroke:#ffd18b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flask .liquid{fill:rgba(235,133,44,.23);stroke:#f2a94f}
.brand{font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(24px,5vw,43px);letter-spacing:1px;color:#ffe0ad;direction:ltr;text-shadow:0 3px 22px #000,0 0 20px rgba(255,168,67,.24)}
.teacher{margin-top:10px;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(12px,2.3vw,18px);letter-spacing:1.5px;color:#f4b65f;direction:ltr;text-shadow:0 2px 12px #000}
.rule{width:115px;height:2px;margin:21px auto 17px;background:linear-gradient(90deg,transparent,#e8a94f,#ffe0a3,#e8a94f,transparent);box-shadow:0 0 12px rgba(255,177,76,.4)}
.motto{font-size:clamp(18px,3.5vw,29px);font-weight:900;line-height:1.8;color:#fff0d8;text-shadow:0 3px 15px #000}
.loader{width:43px;height:43px;margin-top:25px;border:3px solid rgba(255,199,124,.17);border-top-color:#ffd18b;border-left-color:#e68b37;border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 18px rgba(255,172,73,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitReverse{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-24px);opacity:1}}
@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
.content{padding:18px 10px}
.emblem{width:112px;height:112px;margin-bottom:20px}
.rule{margin:16px auto 13px}
.loader{width:38px;height:38px;margin-top:20px}
}
@media(max-height:620px){
.content{transform:scale(.82)}
.emblem{width:90px;height:90px;margin-bottom:12px}
.rule{margin:10px auto}
.loader{width:30px;height:30px;margin-top:12px}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
  
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="./offline.js" defer></script>

</head>
<body>
<main class="splash">
  <img class="bg-blur" src="./85.jpg" alt="" aria-hidden="true">
  <img class="bg-main" src="./85.jpg" alt="دكتور محمود الجنايني">
  <div class="shade"></div>
  <div class="glow"></div>

  <div class="particles" aria-hidden="true">
    <i class="particle"></i><i class="particle"></i>
    <i class="particle"></i><i class="particle"></i>
    <i class="particle"></i><i class="particle"></i>
  </div>

  <section class="content">
    <div class="emblem">
      <div class="orbit"></div>
      <div class="orbit inner"></div>
      <svg class="flask" viewBox="0 0 100 100" aria-label="Chemistry">
        <path d="M37 12h26M42 12v29L20 77a8 8 0 0 0 7 12h46a8 8 0 0 0 7-12L58 41V12"/>
        <path class="liquid" d="M32 66h36l12 15a5 5 0 0 1-5 7H25a5 5 0 0 1-5-7z"/>
        <path d="M33 65h34"/>
        <circle cx="43" cy="75" r="2"/>
        <circle cx="57" cy="82" r="2"/>
        <circle cx="55" cy="71" r="1.5"/>
      </svg>
    </div>

    <h1 class="brand">CHEMISTRY HAS ONE KING</h1>
    <h2 class="teacher">DR. MAHMOUD EL-GENAINY</h2>
    <div class="rule"></div>
    <p class="motto">اصحى وخلي بالك عشان الجن جاي هيفهمها لك 😉</p>
    <div class="loader" role="status" aria-label="Loading"></div>
  </section>
</main>

<script>
window.addEventListener("load",function(){
  setTimeout(function(){
    window.location.replace("login.html");
  },5000);
});
</script>
</body>
</html>
