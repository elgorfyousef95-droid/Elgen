
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1,
        minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#080b18">
  <meta name="description" content="منصة دكتور محمود الجنايني لتعليم الكيمياء">

  <title>دكتور محمود الجنايني | كيمياء كبير واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: 'Cairo', sans-serif;
      background: #080b18;
      color: #fff;
      touch-action: pan-y;
    }

    .welcome {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(25px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(25px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* صورة الدكتور */
    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          180deg,
          rgba(5,8,20,.35),
          rgba(5,8,20,.65) 48%,
          #080b18 100%
        ),
        url("85.jpg") center 25% / cover no-repeat;

      animation: backgroundMove 5s ease-out forwards;
    }

    .welcome::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      background:
        radial-gradient(
          ellipse at center,
          transparent 5%,
          rgba(5,8,20,.25) 70%,
          #080b18 100%
        );
    }

    .content {
      width: min(100%, 850px);
      margin: auto;
      animation: appear 1.1s ease both;
    }

    /* شعار المنصة */
    .symbol {
      width: clamp(65px, 9vw, 100px);
      height: clamp(65px, 9vw, 100px);
      margin: 0 auto 20px;
      border-radius: 27%;

      display: grid;
      place-items: center;

      font-size: clamp(30px, 5vw, 48px);
      font-weight: 900;

      background: linear-gradient(135deg, #8d6cff, #31c9db);
      box-shadow: 0 0 45px #8d6cff70;
      border: 1px solid #ffffff66;
    }

    .welcome-label {
      color: #72e5f1;
      font-size: clamp(15px, 2.5vw, 22px);
      font-weight: 900;
      line-height: 1.9;
      margin-bottom: 12px;
      text-shadow: 0 3px 15px #000;
    }

    h1 {
      font-size: clamp(27px, 6vw, 62px);
      font-weight: 900;
      line-height: 1.55;
      text-shadow: 0 5px 25px #000;
      overflow-wrap: anywhere;
    }

    .tagline {
      margin-top: 10px;
      color: #c5baff;
      font-size: clamp(22px, 4.5vw, 39px);
      font-weight: 900;
      line-height: 1.7;
      text-shadow: 0 4px 20px #000;
    }

    .description {
      margin-top: 15px;
      color: #f0f2fa;
      font-size: clamp(14px, 2.3vw, 21px);
      line-height: 2.1;
      text-shadow: 0 3px 12px #000;
    }

    .subject {
      display: inline-block;
      margin-top: 23px;
      padding: 9px 28px;

      border: 1px solid #7c83ff99;
      border-radius: 50px;

      background: #7771ff30;
      color: #d1ccff;

      font-weight: 900;
      font-size: clamp(14px, 2vw, 19px);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* دائرة التحميل */
    .loader {
      width: 45px;
      height: 45px;
      margin: 32px auto 0;

      border: 3px solid #ffffff30;
      border-top-color: #68dce9;
      border-right-color: #987aff;
      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    .footer {
      margin-top: 17px;
      font-size: clamp(11px, 1.5vw, 14px);
      color: #c1c9dc;
      opacity: .9;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes backgroundMove {
      from {
        transform: scale(1.02);
      }

      to {
        transform: scale(1.10);
      }
    }

    /* الهواتف */
    @media (max-width: 480px) {
      .content {
        max-width: 420px;
      }

      .subject {
        margin-top: 18px;
      }

      .loader {
        margin-top: 25px;
      }
    }

    /* التابلت */
    @media (min-width: 600px) and (max-width: 1024px) {
      .content {
        max-width: 760px;
      }
    }

    /* الكمبيوتر والشاشات الكبيرة */
    @media (min-width: 1025px) {
      .content {
        max-width: 900px;
      }

      .welcome {
        padding: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .welcome::before,
      .loader {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="welcome">

    <section class="content">

      <div class="symbol">ك</div>

      <div class="welcome-label">
        اصحى وخلي بالك عشان الجن هيفهمها لك
      </div>

      <h1>
        للكيمياء كبير واحد
      </h1>

      <div class="tagline">
        دكتور محمود الجنايني
      </div>

      <p class="description">
        المحاضرات والشرح والمراجعات والامتحانات
        <br>
        كل اللي محتاجه عشان تتفوق في الكيمياء
      </p>

      <div class="subject">
        منصة الكيمياء
      </div>

      <div class="loader"></div>

      <div class="footer">
        رحلتك نحو التفوق تبدأ من هنا
      </div>

    </section>

  </main>

  <script>
    window.addEventListener("load", function () {

      setTimeout(function () {

        window.location.replace("login.html");

      }, 5000);

    });
  </script>

</body>
</html>
