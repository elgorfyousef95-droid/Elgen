
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no,
        viewport-fit=cover">

  <meta name="theme-color" content="#100905">
  <title>دكتور محمود الجنايني</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #100905;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      touch-action: pan-y;
    }

    /* الخلفية الرئيسية */

    .welcome {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      background:
        radial-gradient(
          ellipse at 50% 45%,
          #38200c 0%,
          #1c1008 48%,
          #090604 100%
        );

      overflow: hidden;
    }

    .welcome::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 153, 35, .12),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(255, 190, 65, .09),
          transparent 35%
        );
    }

    /* توزيع الصورة والنص */

    .layout {
      width: min(100%, 1450px);
      min-height: min(850px, 92dvh);

      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: clamp(20px, 4vw, 65px);

      animation: enter 1s ease both;
    }

    /* الصورة الأصلية كاملة بدون قص */

    .image-area {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .teacher-image {
      display: block;

      width: min(100%, 650px);
      height: min(82dvh, 780px);

      object-fit: contain;
      object-position: center;

      border-radius: 5px;

      filter: drop-shadow(0 15px 45px rgba(0,0,0,.55));

      animation: imageEnter 1.3s ease both;
    }

    /* منطقة الكتابة */

    .text-area {
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 15px;
    }

    /* أيقونة الكيمياء */

    .chemistry-icon {
      width: clamp(65px, 8vw, 100px);
      height: clamp(65px, 8vw, 100px);

      display: grid;
      place-items: center;

      margin: 0 auto 28px;

      border-radius: 25px;

      border: 1px solid rgba(255, 187, 76, .55);

      background:
        linear-gradient(
          145deg,
          rgba(255, 178, 58, .16),
          rgba(80, 38, 10, .35)
        );

      box-shadow:
        0 0 35px rgba(255, 153, 35, .13),
        inset 0 0 20px rgba(255, 190, 65, .08);
    }

    .chemistry-icon svg {
      width: 65%;
      height: 65%;
      stroke: #ffc15b;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* العبارة الرئيسية */

    .welcome-label {
      color: #ffbd55;

      font-size: clamp(17px, 2.2vw, 27px);
      font-weight: 900;
      line-height: 1.9;

      text-shadow: 0 3px 18px rgba(255, 145, 30, .22);

      margin-bottom: 17px;
    }

    h1 {
      color: #fff4df;

      font-size: clamp(29px, 4.6vw, 58px);
      font-weight: 900;
      line-height: 1.55;

      text-shadow: 0 5px 25px rgba(0,0,0,.65);
    }

    .teacher-name {
      margin-top: 13px;

      color: #ffb83f;

      font-size: clamp(24px, 4vw, 43px);
      font-weight: 900;
      line-height: 1.7;

      text-shadow: 0 4px 22px rgba(255, 145, 30, .2);
    }

    /* دائرة التحميل */

    .loading-area {
      margin-top: 45px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader {
      position: relative;

      width: 53px;
      height: 53px;

      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          #ffbd55,
          #e87519,
          transparent 75%
        );

      animation: rotate 1.1s linear infinite;

      box-shadow: 0 0 22px rgba(255, 166, 48, .19);
    }

    .loader::before {
      content: "";

      position: absolute;
      inset: 4px;

      background: #170d06;
      border-radius: 50%;
    }

    .loader::after {
      content: "";

      position: absolute;
      width: 7px;
      height: 7px;

      background: #fff0c6;
      border-radius: 50%;

      top: -1px;
      left: 50%;

      transform: translateX(-50%);

      box-shadow: 0 0 12px #ffbd55;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageEnter {
      from {
        opacity: 0;
        transform: scale(.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* الموبايل */

    @media (max-width: 650px) {
      .welcome {
        padding:
          max(12px, env(safe-area-inset-top))
          15px
          max(15px, env(safe-area-inset-bottom));
      }

      .layout {
        min-height: calc(100dvh - 30px);

        grid-template-columns: 1fr;
        grid-template-rows: auto auto;

        gap: 5px;
        align-content: center;
      }

      .image-area {
        width: 100%;
      }

      .teacher-image {
        width: min(100%, 480px);
        height: 51dvh;
        max-height: 530px;

        object-fit: contain;
      }

      .text-area {
        padding: 4px 8px;
      }

      .chemistry-icon {
        width: 53px;
        height: 53px;
        margin-bottom: 12px;
        border-radius: 17px;
      }

      .welcome-label {
        font-size: clamp(15px, 4vw, 19px);
        margin-bottom: 5px;
      }

      h1 {
        font-size: clamp(25px, 7vw, 34px);
      }

      .teacher-name {
        font-size: clamp(21px, 6vw, 29px);
        margin-top: 3px;
      }

      .loading-area {
        margin-top: 16px;
      }

      .loader {
        width: 37px;
        height: 37px;
      }
    }

    /* الهواتف الصغيرة */

    @media (max-width: 380px) {
      .teacher-image {
        height: 47dvh;
      }

      .chemistry-icon {
        width: 45px;
        height: 45px;
      }

      .loading-area {
        margin-top: 12px;
      }
    }

    /* التابلت */

    @media (min-width: 651px) and (max-width: 1024px) {
      .layout {
        gap: 20px;
      }

      .teacher-image {
        width: 100%;
        height: 75dvh;
      }
    }

    /* الكمبيوتر والشاشات الكبيرة */

    @media (min-width: 1025px) {
      .layout {
        grid-template-columns: 1.05fr .95fr;
      }

      .teacher-image {
        height: 82dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .layout,
      .teacher-image,
      .loader {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="welcome">

    <div class="layout">

      <div class="image-area">
        <img
          class="teacher-image"
          src="85.jpg"
          alt="دكتور محمود الجنايني"
          fetchpriority="high"
        >
      </div>

      <section class="text-area">

        <div class="chemistry-icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M23 8h18"/>
            <path d="M27 8v17L13 49a5 5 0 0 0 4 7h30a5 5 0 0 0 4-7L37 25V8"/>
            <path d="M20 43h24"/>
            <circle cx="28" cy="35" r="2"/>
            <circle cx="37" cy="47" r="2"/>
            <circle cx="34" cy="29" r="2"/>
          </svg>
        </div>

        <div class="welcome-label">
          اصحى وخلي بالك عشان الجن هيفهمها لك
        </div>

        <h1>
          للكيمياء كبير واحد
        </h1>

        <div class="teacher-name">
          دكتور محمود الجنايني
        </div>

        <div class="loading-area">
          <div class="loader"></div>
        </div>

      </section>

    </div>

  </main>

  <script>
    window.addEventListener("load", function () {

      setTimeout(function () {

        window.location.replace("login.html");

      }, 5000);

    });
  </script>

</body>
</html>
