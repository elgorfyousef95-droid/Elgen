
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100804">
<title>Dr. Mahmoud El-Genainy | Chemistry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 width:100%;min-height:100%;
 overflow:hidden;background:#100804;
}

body{
 color:#fff;
 font-family:'Cairo',sans-serif;
}

.screen{
 width:100%;
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 45%,#38200e,#1c1009 55%,#090503);
}

.main{
 width:min(1250px,100%);
 display:flex;
 align-items:center;
 justify-content:center;
 gap:clamp(20px,5vw,65px);
 animation:appear 1s ease both;
}

/* الصورة كاملة */
.poster{
 flex:0 1 590px;
 width:48%;
 display:flex;
 align-items:center;
 justify-content:center;
}

.poster img{
 display:block;
 width:100%;
 height:auto;
 max-height:85dvh;
 object-fit:contain;
 object-position:center;
 filter:drop-shadow(0 15px 40px #000b);
}

/* منطقة الهوية */
.info{
 flex:1;
 min-width:0;
 max-width:560px;
 text-align:center;
}

/* أيقونة كيمياء أصلية */
.logo{
 width:clamp(70px,8vw,100px);
 height:clamp(70px,8vw,100px);
 margin:0 auto 22px;
 border-radius:28px;
 display:grid;
 place-items:center;
 border:1px solid #e5a94d99;
 background:linear-gradient(145deg,#41250f,#1b0d05);
 box-shadow:0 0 38px #e99a3230,inset 0 0 20px #e99a3215;
 position:relative;
}

.logo::after{
 content:"";
 position:absolute;
 inset:6px;
 border:1px solid #e5a94d35;
 border-radius:22px;
}

.logo svg{
 width:65%;
 height:65%;
 fill:none;
 stroke:#ffc66c;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}

/* الجملة العربية */
.arabic-slogan{
 font-family:'Cairo',sans-serif;
 color:#ffca76;
 font-size:clamp(19px,2.7vw,30px);
 font-weight:900;
 line-height:1.9;
 margin-bottom:17px;
 text-shadow:0 3px 18px #000;
}

/* الإنجليزي */
.english-title{
 direction:ltr;
 font-family:'Montserrat',sans-serif;
 color:#fff2d9;
 font-size:clamp(26px,4vw,48px);
 font-weight:900;
 line-height:1.3;
 text-shadow:0 4px 24px #000;
}

.teacher-name{
 direction:ltr;
 font-family:'Montserrat',sans-serif;
 color:#ffb747;
 font-size:clamp(19px,2.8vw,31px);
 font-weight:800;
 line-height:1.5;
 margin-top:17px;
 overflow-wrap:anywhere;
}

.divider{
 width:105px;
 height:3px;
 margin:26px auto;
 border-radius:10px;
 background:linear-gradient(90deg,transparent,#ffbd55,transparent);
}

/* التحميل */
.loader{
 position:relative;
 width:50px;
 height:50px;
 margin:32px auto 0;
 border-radius:50%;
 background:conic-gradient(#ffc15c,#d66c1c,transparent 78%);
 animation:rotate 1.1s linear infinite;
 box-shadow:0 0 22px #f5a53c30;
}

.loader::before{
 content:"";
 position:absolute;
 inset:5px;
 background:#1c1009;
 border-radius:50%;
}

.loader::after{
 content:"";
 position:absolute;
 top:0;
 left:50%;
 transform:translateX(-50%);
 width:8px;
 height:8px;
 border-radius:50%;
 background:#fff0c5;
 box-shadow:0 0 12px #ffc15c;
}

@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes appear{
 from{opacity:0;transform:translateY(18px)}
 to{opacity:1;transform:translateY(0)}
}

/* الموبايل */
@media(max-width:650px){
 .screen{padding:12px}
 .main{
  flex-direction:column;
  gap:9px;
 }
 .poster{
  flex:none;
  width:min(100%,480px);
 }
 .poster img{
  width:100%;
  max-height:58dvh;
  height:auto;
  object-fit:contain;
 }
 .info{
  flex:none;
  width:100%;
  max-width:500px;
 }
 .logo{
  width:49px;height:49px;
  border-radius:16px;
  margin-bottom:10px;
 }
 .logo::after{inset:4px;border-radius:12px}
 .arabic-slogan{
  font-size:clamp(16px,4.4vw,21px);
  line-height:1.65;
  margin-bottom:6px;
 }
 .english-title{font-size:clamp(21px,6vw,30px)}
 .teacher-name{
  font-size:clamp(16px,4.8vw,23px);
  margin-top:6px;
 }
 .divider{margin:10px auto;width:65px}
 .loader{width:34px;height:34px;margin-top:10px}
 .loader::before{inset:4px}
}

/* التابلت */
@media(min-width:651px) and (max-width:1024px){
 .main{gap:20px}
 .poster{width:48%}
 .info{max-width:48%}
 .logo{width:68px;height:68px}
 .arabic-slogan{font-size:clamp(18px,2.5vw,25px)}
}

/* الشاشات القصيرة */
@media(max-height:650px) and (max-width:650px){
 .main{flex-direction:row;gap:12px}
 .poster{width:48%}
 .info{width:52%}
 .poster img{max-height:85dvh}
 .logo{width:42px;height:42px;margin-bottom:7px}
 .arabic-slogan{font-size:15px;margin-bottom:4px}
 .english-title{font-size:20px}
 .teacher-name{font-size:15px;margin-top:4px}
 .divider{margin:7px auto}
 .loader{width:29px;height:29px;margin-top:7px}
}

@media(prefers-reduced-motion:reduce){
 .main,.loader{animation-duration:.01ms!important}
}
</style>
</head>

<body>

<main class="screen">
 <div class="main">

  <div class="poster">
   <img src="85.jpg" alt="Dr. Mahmoud El-Genainy">
  </div>

  <section class="info">

   <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
     <path d="M23 7h18"/>
     <path d="M27 7v18L12 49a5 5 0 0 0 4 8h32a5 5 0 0 0 4-8L37 25V7"/>
     <path d="M19 43h26"/>
     <circle cx="27" cy="35" r="2"/>
     <circle cx="37" cy="48" r="2"/>
     <circle cx="35" cy="31" r="2"/>
     <path d="M8 16l3 3 3-3M50 13l3 3 3-3"/>
    </svg>
   </div>

   <div class="arabic-slogan">
     😉اصحى وخلي بالك عشان الجن جاي هيفهمها لك
   </div>

   <h1 class="english-title">
    CHEMISTRY HAS ONE KING
   </h1>

   <div class="teacher-name">
    DR. MAHMOUD EL-GENAINY
   </div>

   <div class="divider"></div>

   <div class="loader"></div>

  </section>

 </div>
</main>

<script>
window.addEventListener("load",function(){
 setTimeout(function(){
  window.location.replace("login.html");
 },5000);
});
</script>

</body>
</html>
