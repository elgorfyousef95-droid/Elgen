
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Dr. Mahmoud El-Genainy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0c1220}
body{font-family:'Cairo',sans-serif;color:#fff}
.splash-screen{position:fixed;inset:0;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 18px max(25px,env(safe-area-inset-bottom));background:#0c1220}
.splash-background{position:absolute;inset:-22px;width:calc(100% + 44px);height:calc(100% + 44px);object-fit:cover;object-position:center;filter:blur(20px) brightness(.38) saturate(.82);transform:scale(1.08);z-index:-4}
.splash-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;z-index:-3;pointer-events:none}
.splash-overlay{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at center,rgba(18,29,48,.16) 0%,rgba(12,18,32,.42) 58%,rgba(7,11,21,.84) 100%),linear-gradient(180deg,rgba(8,14,26,.18),rgba(8,14,26,.28) 48%,rgba(8,14,26,.78))}
.splash-content{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:splashEnter 1.05s cubic-bezier(.2,.75,.25,1) both}
.splash-logo{width:clamp(104px,18vw,145px);height:clamp(104px,18vw,145px);display:grid;place-items:center;border-radius:38px;border:1px solid rgba(255,207,132,.62);background:linear-gradient(145deg,rgba(37,52,73,.86),rgba(13,23,39,.92));box-shadow:0 0 0 8px rgba(255,196,104,.055),0 0 48px rgba(238,174,85,.25),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:logoFloat 4s ease-in-out infinite}
.splash-logo svg{width:64%;height:64%;fill:none;stroke:#ffd18b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 9px rgba(255,190,103,.42))}
.splash-line{width:104px;height:2px;margin:25px auto 18px;border-radius:5px;background:linear-gradient(90deg,transparent,#e8b86f,transparent);box-shadow:0 0 13px rgba(232,184,111,.42)}
.splash-title{font-family:'Montserrat',sans-serif;font-size:clamp(25px,5.3vw,43px);font-weight:900;letter-spacing:1.5px;line-height:1.2;color:#f5d49d;text-shadow:0 3px 22px rgba(0,0,0,.75);direction:ltr}
.splash-subtitle{margin-top:11px;font-family:'Montserrat',sans-serif;font-size:clamp(13px,2.6vw,19px);font-weight:800;letter-spacing:1.4px;color:#fff3df;text-shadow:0 2px 14px #000;direction:ltr}
.splash-motto{margin-top:24px;max-width:700px;font-size:clamp(18px,3.6vw,29px);font-weight:900;line-height:1.9;color:#ffdda9;text-shadow:0 3px 18px rgba(0,0,0,.95)}
.splash-loading{width:48px;height:48px;margin-top:29px;border-radius:50%;border:3px solid rgba(235,194,127,.2);border-top-color:#f3c77e;border-right-color:#a9d2c8;box-shadow:0 0 20px rgba(235,194,127,.16);animation:loaderSpin 1s linear infinite}
@keyframes loaderSpin{to{transform:rotate(360deg)}}
@keyframes splashEnter{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:600px){
.splash-screen{padding-left:14px;padding-right:14px}
.splash-logo{width:108px;height:108px;border-radius:31px}
.splash-line{margin:19px auto 14px}
.splash-motto{margin-top:18px;line-height:1.75}
.splash-loading{width:42px;height:42px;margin-top:23px}
}
@media(max-height:650px){
.splash-content{transform:scale(.86)}
.splash-logo{width:88px;height:88px}
.splash-line{margin:12px auto}
.splash-motto{margin-top:12px}
.splash-loading{width:35px;height:35px;margin-top:15px}
}
@media(prefers-reduced-motion:reduce){
.splash-content,.splash-logo,.splash-loading{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<main class="splash-screen" id="splashScreen">
  <img class="splash-background" src="85.jpg" alt="" aria-hidden="true">
  <img class="splash-photo" src="85.jpg" alt="دكتور محمود الجنايني">
  <div class="splash-overlay" aria-hidden="true"></div>

  <section class="splash-content">
    <div class="splash-logo" aria-label="Chemistry">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M23 7h18M27 7v18L12 49a5 5 0 0 0 4 8h32a5 5 0 0 0 4-8L37 25V7"/>
        <path d="M19 43h26"/>
        <circle cx="27" cy="35" r="2"/>
        <circle cx="37" cy="48" r="2"/>
        <circle cx="35" cy="31" r="2"/>
      </svg>
    </div>

    <div class="splash-line"></div>
    <h1 class="splash-title">CHEMISTRY HAS ONE KING</h1>
    <h2 class="splash-subtitle">DR. MAHMOUD EL-GENAINY</h2>
    <p class="splash-motto">اصحى وخلي بالك عشان الجن جاي هيفهمها لك 😉</p>
    <div class="splash-loading" role="status" aria-label="Loading"></div>
  </section>
</main>

<script>
window.addEventListener("load",function(){
  window.setTimeout(function(){
    window.location.replace("login.html");
  },5000);
});
</script>
</body>
</html>
