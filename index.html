
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100804">
<title>Dr. Mahmoud El-Genainy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  background: #100804;
}

body {
  font-family: 'Cairo', sans-serif;
  color: #fff;
}

.splash {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding:
    max(22px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(28px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
  background: #100804;
}

/* خلفية ممتدة من الصورة نفسها */
.background-fill {
  position: absolute;
  inset: -25px;
  z-index: -3;
  width: calc(100% + 50px);
  height: calc(100% + 50px);
  object-fit: cover;
  object-position: center;
  filter: blur(24px) brightness(.42);
  transform: scale(1.08);
}

/* الصورة الأصلية كاملة فوق الخلفية */
.full-image {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
}

/* تدرج خفيف يساعد على وضوح الكتابة */
.splash::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(12, 7, 3, .03) 35%,
      rgba(12, 7, 3, .18) 55%,
      rgba(12, 7, 3, .88) 100%
    );
}

/* محتوى الترحيب */
.content {
  position: relative;
  width: min(100%, 760px);
  margin: 0 auto;
  text-align: center;
  padding: clamp(17px, 3vw, 28px);
  border: 1px solid rgba(255, 195, 112, .28);
  border-radius: 26px;
  background: linear-gradient(
    145deg,
    rgba(25, 15, 8, .77),
    rgba(12, 8, 5, .88)
  );
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    0 15px 50px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.08);
  animation: rise .9s ease both;
}

/* أيقونة الكيمياء */
.chemistry-icon {
  width: 57px;
  height: 57px;
  margin: 0 auto 12px;
  display: grid;
  place-items: center;
  border-radius: 19px;
  border: 1px solid rgba(255, 193, 92, .65);
  background: linear-gradient(145deg, #513015, #211006);
  box-shadow: 0 0 25px rgba(255, 174, 66, .2);
}

.chemistry-icon svg {
  width: 36px;
  height: 36px;
  fill: none;
  stroke: #ffc56c;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* الجملة العربية */
.slogan {
  color: #ffcf82;
  font-size: clamp(18px, 3.2vw, 30px);
  font-weight: 900;
  line-height: 1.8;
  text-shadow: 0 3px 15px #000;
}

.wink {
  display: inline-block;
  margin-right: 5px;
  font-size: 1.05em;
}

/* الاسم */
.king {
  margin-top: 7px;
  color: #fff1d9;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(19px, 3.1vw, 31px);
  font-weight: 900;
  line-height: 1.5;
  direction: ltr;
  text-shadow: 0 3px 14px #000;
}

.teacher {
  margin-top: 5px;
  color: #ffb94f;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(13px, 2vw, 19px);
  font-weight: 800;
  letter-spacing: 1px;
  direction: ltr;
}

/* خط ذهبي */
.divider {
  width: 90px;
  height: 2px;
  margin: 15px auto 17px;
  border-radius: 5px;
  background: linear-gradient(
    90deg,
    transparent,
    #ffc15c,
    transparent
  );
}

/* دائرة التحميل */
.loader {
  width: 39px;
  height: 39px;
  margin: 0 auto;
  position: relative;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #fff0c2,
    #ffc15c,
    #b85d18,
    transparent 85%
  );
  animation: spin 1s linear infinite;
  box-shadow: 0 0 20px rgba(255, 177, 67, .25);
}

.loader::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #1b1008;
}

.loader::after {
  content: "";
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff4d6;
  box-shadow: 0 0 12px #ffc15c;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* الموبايل */
@media (max-width: 600px) {
  .splash {
    padding: 14px 12px max(20px, env(safe-area-inset-bottom));
  }

  .full-image {
    object-position: center center;
  }

  .content {
    padding: 15px 11px;
    border-radius: 20px;
  }

  .chemistry-icon {
    width: 45px;
    height: 45px;
    border-radius: 15px;
    margin-bottom: 8px;
  }

  .chemistry-icon svg {
    width: 29px;
    height: 29px;
  }

  .slogan {
    font-size: clamp(16px, 4.3vw, 23px);
    line-height: 1.7;
  }

  .king {
    font-size: clamp(17px, 4.5vw, 25px);
  }

  .teacher {
    font-size: 12px;
  }

  .divider {
    margin: 10px auto 12px;
  }

  .loader {
    width: 33px;
    height: 33px;
  }
}

/* التابلت */
@media (min-width: 601px) and (max-width: 1024px) {
  .content {
    width: min(85%, 700px);
  }
}

/* الشاشات القصيرة */
@media (max-height: 550px) {
  .content {
    padding: 10px;
  }

  .chemistry-icon {
    width: 38px;
    height: 38px;
    margin-bottom: 5px;
  }

  .chemistry-icon svg {
    width: 25px;
    height: 25px;
  }

  .divider {
    margin: 7px auto;
  }

  .loader {
    width: 28px;
    height: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .content, .loader {
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="splash">

  <img class="background-fill" src="85.jpg" alt="" aria-hidden="true">

  <img class="full-image" src="85.jpg" alt="دكتور محمود الجنايني">

  <section class="content">

    <div class="chemistry-icon">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M23 7h18"/>
        <path d="M27 7v18L12 49a5 5 0 0 0 4 8h32a5 5 0 0 0 4-8L37 25V7"/>
        <path d="M19 43h26"/>
        <circle cx="27" cy="35" r="2"/>
        <circle cx="37" cy="48" r="2"/>
        <circle cx="35" cy="31" r="2"/>
      </svg>
    </div>

    <div class="slogan">
      اصحى وخلي بالك عشان الجن جاي هيفهمها لك
      <span class="wink">😉</span>
    </div>

    <div class="king">
      CHEMISTRY HAS ONE KING
    </div>

    <div class="teacher">
      DR. MAHMOUD EL-GENAINY
    </div>

    <div class="divider"></div>

    <div class="loader"></div>

  </section>

</main>

<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    window.location.replace("login.html");
  }, 5000);
});
</script>

</body>
</html>
