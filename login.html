
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d17">
<title>تسجيل الدخول | Dr. Mahmoud El-Genainy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#f4bd70;
  --gold-light:#ffe0ad;
  --navy:#0a1020;
  --white:#fff;
  --muted:#c4c5ce;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  touch-action:pan-y;
}
body{
  width:100%;
  min-height:100vh;
  min-height:100svh;
  font-family:'Cairo',sans-serif;
  color:var(--white);
  background:var(--navy);
  overflow-x:hidden;
  touch-action:pan-y;
}
button,input,a{
  font:inherit;
}
button{
  cursor:pointer;
}
.page{
  position:relative;
  isolation:isolate;
  min-height:100vh;
  min-height:100svh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    max(24px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
}
.background{
  position:fixed;
  inset:0;
  z-index:-3;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.overlay{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,rgba(5,9,18,.72),rgba(5,9,18,.48)),
    linear-gradient(180deg,rgba(5,9,18,.28),rgba(5,9,18,.78));
}
.ambient{
  position:fixed;
  z-index:-1;
  width:min(90vw,650px);
  height:min(90vw,650px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(225,153,69,.13),transparent 68%);
  pointer-events:none;
}
.login-layout{
  width:min(100%,470px);
  margin:auto;
  animation:enter .8s ease both;
}
.brand{
  text-align:center;
  margin-bottom:24px;
}
.brand-mark{
  width:65px;
  height:65px;
  margin:0 auto 13px;
  display:grid;
  place-items:center;
  border-radius:22px;
  border:1px solid rgba(255,207,145,.52);
  background:linear-gradient(145deg,rgba(75,48,25,.65),rgba(15,19,29,.82));
  box-shadow:0 0 30px rgba(230,158,74,.18),inset 0 1px rgba(255,255,255,.13);
}
.brand-mark svg{
  width:39px;
  height:39px;
  fill:none;
  stroke:var(--gold-light);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.brand-name{
  font-size:clamp(20px,5vw,27px);
  font-weight:900;
  color:var(--gold-light);
  letter-spacing:.3px;
}
.brand-subtitle{
  margin-top:3px;
  color:#e6d3b8;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.3px;
  direction:ltr;
}
.card{
  width:100%;
  padding:clamp(23px,5vw,36px);
  border:1px solid rgba(255,202,132,.27);
  border-radius:27px;
  background:linear-gradient(145deg,rgba(13,20,34,.91),rgba(9,13,24,.88));
  box-shadow:0 24px 80px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.heading{
  text-align:center;
  margin-bottom:25px;
}
.heading h1{
  font-size:clamp(23px,5vw,29px);
  font-weight:900;
  color:#fff3df;
}
.heading p{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
  line-height:1.8;
}
.field{
  margin-bottom:18px;
}
.field label{
  display:block;
  margin-bottom:8px;
  color:#f5d7ad;
  font-size:14px;
  font-weight:800;
}
.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
  min-height:57px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:15px;
  background:rgba(255,255,255,.055);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.input-wrap:focus-within{
  border-color:rgba(244,189,112,.75);
  background:rgba(255,255,255,.085);
  box-shadow:0 0 0 3px rgba(244,189,112,.09);
}
.field-icon{
  flex:0 0 48px;
  display:grid;
  place-items:center;
  color:var(--gold);
}
.field-icon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.input-wrap input{
  width:100%;
  min-width:0;
  height:55px;
  padding:0 5px 0 14px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  direction:rtl;
}
.input-wrap input::placeholder{
  color:#9296a5;
  font-size:13px;
}
.password-toggle{
  flex:0 0 46px;
  height:48px;
  border:0;
  color:#d8b889;
  background:transparent;
  display:grid;
  place-items:center;
}
.password-toggle svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
}
.form-options{
  display:flex;
  justify-content:flex-start;
  margin:1px 0 22px;
}
.text-link{
  color:var(--gold);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}
.text-link:active{
  opacity:.7;
}
.submit{
  width:100%;
  min-height:57px;
  border:1px solid rgba(255,226,179,.65);
  border-radius:15px;
  color:#211407;
  font-size:16px;
  font-weight:900;
  background:linear-gradient(110deg,#b97935,#f5c47c,#e9a64f);
  box-shadow:0 9px 25px rgba(195,126,53,.2),inset 0 1px rgba(255,255,255,.45);
  transition:transform .2s,filter .2s;
}
.submit:active{
  transform:scale(.985);
  filter:brightness(1.08);
}
.register{
  margin-top:23px;
  text-align:center;
  color:#c6c6cf;
  font-size:13px;
  line-height:2;
}
.register a{
  color:var(--gold-light);
  font-weight:900;
  text-decoration:none;
  margin-right:4px;
}
.bottom-note{
  text-align:center;
  margin-top:18px;
  color:rgba(255,255,255,.57);
  font-size:11px;
}
@keyframes enter{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:380px){
  .page{padding-left:12px;padding-right:12px}
  .card{padding:21px 17px;border-radius:22px}
  .brand{margin-bottom:17px}
  .brand-mark{width:57px;height:57px}
  .heading{margin-bottom:19px}
  .input-wrap,.input-wrap input{min-height:53px;height:53px}
}
@media(max-height:700px){
  .page{align-items:flex-start}
  .login-layout{margin:auto}
  .brand{margin-bottom:13px}
  .brand-mark{width:48px;height:48px;margin-bottom:7px;border-radius:16px}
  .brand-mark svg{width:30px;height:30px}
  .card{padding:19px 24px}
  .heading{margin-bottom:15px}
  .field{margin-bottom:12px}
  .form-options{margin-bottom:15px}
  .register{margin-top:13px}
  .bottom-note{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<main class="page">
  <img class="background" src="./login-bg.png" alt="">
  <div class="overlay"></div>
  <div class="ambient"></div>

  <section class="login-layout">
    <header class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M23 7h18M27 7v18L12 49a5 5 0 0 0 4 8h32a5 5 0 0 0 4-8L37 25V7"/>
          <path d="M19 43h26"/>
          <circle cx="27" cy="35" r="2"/>
          <circle cx="37" cy="48" r="2"/>
          <circle cx="35" cy="31" r="2"/>
        </svg>
      </div>
      <div class="brand-name">DR. MAHMOUD EL-GENAINY</div>
      <div class="brand-subtitle">CHEMISTRY HAS ONE KING</div>
    </header>

    <section class="card">
      <div class="heading">
        <h1>تسجيل الدخول</h1>
        <p>أدخل بيانات حسابك للمتابعة</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <div class="input-wrap">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
                <path d="M8 6h8M9 18h6"/>
              </svg>
            </span>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="أدخل رقم هاتفك" required>
          </div>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
              </svg>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
            <button class="password-toggle" id="togglePassword" type="button" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <a class="text-link" href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button class="submit" type="submit">تسجيل الدخول</button>
      </form>

      <div class="register">
        ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </div>
    </section>

    <div class="bottom-note">DR. MAHMOUD EL-GENAINY · CHEMISTRY</div>
  </section>
</main>

<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function () {
  const showing = passwordInput.type === "text";
  passwordInput.type = showing ? "password" : "text";
  togglePassword.setAttribute(
    "aria-label",
    showing ? "إظهار كلمة المرور" : "إخفاء كلمة المرور"
  );
});

document.getElementById("loginForm").addEventListener("submit", function(event){
  event.preventDefault();
  // ربط التحقق الفعلي من الهاتف وكلمة المرور بقاعدة البيانات في مرحلة الربط.
});
</script>
</body>
</html>
